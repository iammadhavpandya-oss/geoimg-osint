[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoimg"
version = "0.2.0"
description = "Defensive/educational image geolocation OSINT toolkit (EXIF, OCR, India heuristics, evidence-chain reports)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Madhav Pandya (CyberWithMadhav)"}]
dependencies = ["pillow>=10", "piexif", "requests", "jinja2", "imagehash", "numpy", "opencv-python-headless", "astral>=3"]

[project.optional-dependencies]
web = ["flask>=3"]
pdf = ["weasyprint"]
dev = ["pytest"]

[project.scripts]
geoimg = "geoimg.cli:main"

[tool.setuptools]
packages = ["geoimg", "geoimg.modules"]

[tool.setuptools.package-data]
geoimg = ["templates/*.html"]
